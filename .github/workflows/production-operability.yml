name: Production Operability

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 * * * *"
    - cron: "17 */6 * * *"
    - cron: "33 2 * * *"
    - cron: "21 3 * * 0"
  workflow_dispatch:
    inputs:
      check:
        description: "Check to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - synthetic
          - core-load
          - providers
          - env-audit
          - auth-smoke
          - query-plan
          - maintainability
          - readiness
          - implementation30
          - implementation90
          - scorecard
          - pilot
          - security
          - backup-restore
          - incident-drill

permissions:
  contents: read

jobs:
  production-operability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Synthetic monitor
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'synthetic' || github.event.schedule == '*/15 * * * *'
        env:
          SYNTHETIC_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          SYNTHETIC_WEB_BASE_URL: ${{ secrets.WEB_APP_URL || secrets.PUBLIC_APP_URL || 'https://www.myshule.online' }}
          SYNTHETIC_TENANT_ID: ${{ secrets.PROD_MONITOR_TENANT_ID }}
          SYNTHETIC_MONITOR_TOKEN: ${{ secrets.PROD_MONITOR_ACCESS_TOKEN }}
          SYNTHETIC_ALLOW_REMOTE: "true"
        run: npm run monitor:synthetic > production-synthetic.json

      - name: Core API load
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'core-load' || github.event.schedule == '7 * * * *'
        env:
          CORE_API_LOAD_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          CORE_API_LOAD_TENANT_ID: ${{ secrets.PROD_MONITOR_TENANT_ID }}
          CORE_API_LOAD_MONITOR_TOKEN: ${{ secrets.PROD_MONITOR_ACCESS_TOKEN }}
          CORE_API_LOAD_ALLOW_REMOTE: "true"
          CORE_API_LOAD_ITERATIONS: "3"
        run: npm run load:core-api > production-core-load.json

      - name: Provider smoke
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'providers' || github.event.schedule == '17 */6 * * *'
        continue-on-error: true
        env:
          SUPPORT_PROVIDER_SMOKE_REQUIRE_SMS: ${{ secrets.SUPPORT_PROVIDER_SMOKE_REQUIRE_SMS || 'false' }}
          SUPPORT_PROVIDER_SMOKE_LIVE: ${{ secrets.SUPPORT_PROVIDER_SMOKE_LIVE || 'false' }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          REDIS_TLS_ENABLED: "true"
          SUPPORT_NOTIFICATION_EMAILS: ${{ secrets.SUPPORT_NOTIFICATION_EMAILS }}
          SUPPORT_NOTIFICATION_SMS_WEBHOOK_URL: ${{ secrets.SUPPORT_NOTIFICATION_SMS_WEBHOOK_URL }}
          SUPPORT_NOTIFICATION_SMS_WEBHOOK_HEALTH_URL: ${{ secrets.SUPPORT_NOTIFICATION_SMS_WEBHOOK_HEALTH_URL }}
          SUPPORT_NOTIFICATION_SMS_WEBHOOK_TOKEN: ${{ secrets.SUPPORT_NOTIFICATION_SMS_WEBHOOK_TOKEN }}
          SUPPORT_NOTIFICATION_SMS_RECIPIENTS: ${{ secrets.SUPPORT_NOTIFICATION_SMS_RECIPIENTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PROVIDER_SMOKE_URL: ${{ secrets.EMAIL_PROVIDER_SMOKE_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL || secrets.WEB_APP_URL || 'https://www.myshule.online' }}
          UPLOAD_MALWARE_SCAN_PROVIDER: "clamav"
          UPLOAD_MALWARE_SCAN_API_URL: ${{ secrets.UPLOAD_MALWARE_SCAN_API_URL }}
          UPLOAD_MALWARE_SCAN_HEALTH_URL: ${{ secrets.UPLOAD_MALWARE_SCAN_HEALTH_URL }}
          UPLOAD_MALWARE_SCAN_API_TOKEN: ${{ secrets.UPLOAD_MALWARE_SCAN_API_TOKEN }}
          UPLOAD_MALWARE_SCAN_REQUIRED: "true"
          UPLOAD_OBJECT_STORAGE_ENABLED: "true"
          UPLOAD_OBJECT_STORAGE_PROVIDER: ${{ secrets.UPLOAD_OBJECT_STORAGE_PROVIDER }}
          UPLOAD_OBJECT_STORAGE_ENDPOINT: ${{ secrets.UPLOAD_OBJECT_STORAGE_ENDPOINT }}
          UPLOAD_OBJECT_STORAGE_BUCKET: ${{ secrets.UPLOAD_OBJECT_STORAGE_BUCKET }}
          UPLOAD_OBJECT_STORAGE_REGION: ${{ secrets.UPLOAD_OBJECT_STORAGE_REGION }}
          UPLOAD_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.UPLOAD_OBJECT_STORAGE_ACCESS_KEY_ID }}
          UPLOAD_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.UPLOAD_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p docs/validation
          node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/src/scripts/provider-credential-smoke.ts | tee docs/validation/provider-credential-smoke-live.json > production-provider-smoke.json

      - name: Production environment audit
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'env-audit' || github.event.inputs.check == 'readiness' || github.event.inputs.check == 'scorecard' || github.event.schedule == '33 2 * * *'
        continue-on-error: true
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_SSL: "true"
          DATABASE_PGBOUNCER_MODE: transaction
          DATABASE_RLS_AUDIT_ENABLED: "true"
          DATABASE_API_MAX_CONNECTIONS: "30"
          DATABASE_WORKER_MAX_CONNECTIONS: "10"
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          REDIS_TLS_ENABLED: "true"
          APP_CORS_ENABLED: "true"
          APP_CORS_ORIGINS: ${{ secrets.WEB_APP_URL || secrets.PUBLIC_APP_URL || 'https://www.myshule.online' }}
          APP_TRUSTED_PROXY_CIDRS: ${{ secrets.APP_TRUSTED_PROXY_CIDRS }}
          APP_TRUSTED_TENANT_HEADER_SECRET: ${{ secrets.APP_TRUSTED_TENANT_HEADER_SECRET }}
          AUTH_COOKIE_SECURE: "true"
          AUTH_COOKIE_SAME_SITE: lax
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REPORT_CARD_DOWNLOAD_SIGNING_SECRET: ${{ secrets.REPORT_CARD_DOWNLOAD_SIGNING_SECRET }}
          SECURITY_PII_ENCRYPTION_KEY: ${{ secrets.SECURITY_PII_ENCRYPTION_KEY }}
          SECURITY_LOCKDOWN_BYPASS_SECRET: ${{ secrets.SECURITY_LOCKDOWN_BYPASS_SECRET }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORT_CODE: ${{ secrets.MPESA_SHORT_CODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_TRANSACTION_STATUS_SECURITY_CREDENTIAL: ${{ secrets.MPESA_TRANSACTION_STATUS_SECURITY_CREDENTIAL }}
          MPESA_CALLBACK_URL: ${{ secrets.MPESA_CALLBACK_URL }}
          MPESA_CALLBACK_SECRET: ${{ secrets.MPESA_CALLBACK_SECRET }}
          MPESA_LEDGER_DEBIT_ACCOUNT_CODE: ${{ secrets.MPESA_LEDGER_DEBIT_ACCOUNT_CODE }}
          MPESA_LEDGER_CREDIT_ACCOUNT_CODE: ${{ secrets.MPESA_LEDGER_CREDIT_ACCOUNT_CODE }}
          MPESA_PAYLOAD_VAULT_ENABLED: "true"
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL || secrets.WEB_APP_URL || 'https://www.myshule.online' }}
          SUPPORT_NOTIFICATION_EMAILS: ${{ secrets.SUPPORT_NOTIFICATION_EMAILS }}
          UPLOAD_MALWARE_SCAN_PROVIDER: clamav
          UPLOAD_MALWARE_SCAN_API_URL: ${{ secrets.UPLOAD_MALWARE_SCAN_API_URL }}
          UPLOAD_MALWARE_SCAN_HEALTH_URL: ${{ secrets.UPLOAD_MALWARE_SCAN_HEALTH_URL }}
          UPLOAD_MALWARE_SCAN_API_TOKEN: ${{ secrets.UPLOAD_MALWARE_SCAN_API_TOKEN }}
          UPLOAD_MALWARE_SCAN_REQUIRED: "true"
          UPLOAD_OBJECT_STORAGE_ENABLED: "true"
          UPLOAD_OBJECT_STORAGE_PROVIDER: ${{ secrets.UPLOAD_OBJECT_STORAGE_PROVIDER }}
          UPLOAD_OBJECT_STORAGE_ENDPOINT: ${{ secrets.UPLOAD_OBJECT_STORAGE_ENDPOINT }}
          UPLOAD_OBJECT_STORAGE_BUCKET: ${{ secrets.UPLOAD_OBJECT_STORAGE_BUCKET }}
          UPLOAD_OBJECT_STORAGE_REGION: ${{ secrets.UPLOAD_OBJECT_STORAGE_REGION }}
          UPLOAD_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.UPLOAD_OBJECT_STORAGE_ACCESS_KEY_ID }}
          UPLOAD_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.UPLOAD_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
        run: npm run env:production:audit > production-env-audit.json

      - name: Hosted production auth smoke
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'auth-smoke' || github.event.inputs.check == 'readiness' || github.event.inputs.check == 'scorecard' || github.event.schedule == '33 2 * * *'
        continue-on-error: true
        env:
          MYSHULE_WEB_URL: ${{ secrets.WEB_APP_URL || secrets.PUBLIC_APP_URL || 'https://www.myshule.online' }}
          MYSHULE_API_URL: ${{ secrets.PROD_API_BASE_URL }}
          MYSHULE_SMOKE_TENANT: ${{ secrets.PROD_SMOKE_TENANT_SLUG }}
          MYSHULE_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
        run: npm run smoke:production-auth > production-auth-smoke.json

      - name: Query plan review
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'query-plan' || github.event.schedule == '33 2 * * *'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm run perf:query-plan-review > production-query-plan.json

      - name: Release readiness
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'readiness' || github.event.schedule == '33 2 * * *'
        run: npm run release:readiness > production-release-readiness.json

      - name: Maintainability scan
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'maintainability' || github.event.schedule == '33 2 * * *'
        run: npm run maintainability:scan

      - name: Production scorecard
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'scorecard' || github.event.schedule == '33 2 * * *'
        run: npm run scorecard:production

      - name: Implementation 30 certification
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'implementation30' || github.event.schedule == '33 2 * * *'
        run: |
          npm run implementation30:certify
          npm run implementation30:rollout-gate
          npm run implementation30:load-profile
          npm run module-access:certify

      - name: Implementation 90 load profile
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'implementation90' || github.event.schedule == '33 2 * * *'
        run: npm run implementation90:load-profile > production-implementation90-load-profile.txt

      - name: Pilot workflow certification
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'pilot' || github.event.schedule == '33 2 * * *'
        env:
          PILOT_CERTIFICATION_LIVE: ${{ secrets.PILOT_CERTIFICATION_LIVE || 'false' }}
          PILOT_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PILOT_WEB_BASE_URL: ${{ secrets.WEB_APP_URL || secrets.PUBLIC_APP_URL || 'https://www.myshule.online' }}
          PILOT_TENANT_ID: ${{ secrets.PROD_MONITOR_TENANT_ID }}
          PILOT_ACCESS_TOKEN: ${{ secrets.PROD_MONITOR_ACCESS_TOKEN }}
        run: |
          npm run certify:pilot
          npm run finance:certify
          npm run library:certify
          npm run discipline:certify
          npm run implementation20:certify
          npm run implementation21:certify
          npm run implementation30:certify
          npm run implementation30:rollout-gate
          npm run implementation30:load-profile
          npm run module-access:certify

      - name: Security and tenant isolation audit
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'security' || github.event.schedule == '33 2 * * *'
        run: |
          npm run tenant:isolation:audit
          npm run security:scan
          npm run security:pii-scan
          npm run security:deps

      - name: Backup restore verification
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'backup-restore' || github.event.schedule == '21 3 * * 0'
        env:
          DATABASE_URL: ${{ secrets.DR_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            export PG_BIN_DIR="$(pg_config --bindir)"
          fi
          npm run dr:backup-restore > production-backup-restore.txt

      - name: Incident drill validation
        if: github.event.inputs.check == 'all' || github.event.inputs.check == 'incident-drill' || github.event.schedule == '21 3 * * 0'
        run: npm run ops:incident-drill -- --dry-run > production-incident-drill.json

      - name: Upload sanitized operability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-operability-${{ github.run_id }}
          path: |
            production-*.json
            production-*.txt
            docs/scorecards/production-readiness-scorecard.md
            docs/validation/production-auth-smoke.json
            docs/validation/production-env-audit.json
            docs/validation/provider-credential-smoke-live.json
            docs/validation/implementation10-pilot-certification.md
            docs/validation/implementation10-finance-certification.md
            docs/validation/implementation10-library-certification.md
            docs/validation/implementation10-discipline-certification.md
            docs/validation/implementation11-maintainability-scan.md
            docs/validation/implementation20-certification.md
            docs/validation/implementation21-certification.md
            docs/validation/implementation30-certification.md
            docs/validation/implementation30-load-profile.md
            docs/validation/implementation30-rollout-gate.md
            docs/validation/implementation90-load-profile.md
            docs/validation/query-plan-review.md
            docs/validation/module-access-certification.md
            docs/security/implementation10-threat-model.md
            docs/security/implementation10-security-audit.md
            docs/security/implementation10-security-scan.md
            docs/security/pii-leak-ci-scan.md
          if-no-files-found: ignore
          retention-days: 14
