name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Quality Gate: Lint + Type Check
  # ──────────────────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Type check (backend)
        run: npm run typecheck

      - name: Lint (frontend)
        run: npm run web:lint

      - name: Browser authentication contracts
        run: npm --prefix apps/web run test:design -- persistent-login auth-route-contract auth-token-containment server-auth-client session-refreshing-fetch session-logout dashboard-api-cookie-session

      - name: Dashboard role switching and delayed session responses
        run: npm --prefix apps/web run test:design -- role-switch-consistency dashboard-role-context school-dashboard-role-switcher active-role-cache-isolation leadership-teacher-role-switch

      - name: Academic intelligence workspace contracts
        run: npm --prefix apps/web run test:design -- academic-intelligence head-of-subject exams-workspace teacher-exams-marks-workspace

      - name: Exam setup configuration and deletion controls
        run: npm --prefix apps/web run test:design -- exam-setup-edit-delete exams-manager-human-workflows exams-manager-routing

      - name: Teacher marks roster and routing contracts
        run: npm --prefix apps/web run test:design -- teacher-mark-sheet-pagination teacher-dashboard-routing

      - name: Exams manager dashboard and teacher follow-up contracts
        run: npm --prefix apps/web run test:design -- --runTestsByPath tests/design/exams-manager-command-center.test.ts tests/design/exams-manager-human-workflows.test.ts tests/design/exams-manager-routing.test.tsx tests/design/exams-manager-teacher-progress.test.tsx

      - name: Sidebar loading and recovery contracts
        run: npm --prefix apps/web run test:design -- sidebar-workspace-recovery

      - name: School staff search and invitation contracts
        run: npm --prefix apps/web run test:design -- staff-directory user-management-invitations

      - name: Simplified academic setup contracts
        run: npm --prefix apps/web run test:design -- academic-setup-simplification academic-foundation-record-visibility academic-foundation-workspace subject-teacher-assignment-surfaces academic-curriculum-builder academic-policy-builders

  # ──────────────────────────────────────────────────────────────
  # Build + Unit Tests
  # ──────────────────────────────────────────────────────────────
  build-and-test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Academic analytics print authorization and pagination
        run: node --test dist/apps/api/src/modules/exams/analytics/analytics-report.test.js dist/apps/api/src/auth/head-of-subject.test.js

      - name: Install isolated session test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Persistent authentication contracts with real Redis
        run: node -r ts-node/register/transpile-only -r tsconfig-paths/register --test apps/api/src/auth/persistent-session.test.ts apps/api/src/auth/auth-recovery.service.test.ts

      - name: Authentication tenant isolation and Super Admin compatibility
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/auth-security.integration-spec.ts apps/api/test/auth-experience-separation.integration-spec.ts

      - name: Academic intelligence tenant, scope and migration contracts
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/academic-intelligence.integration-spec.ts

      - name: Exam setup transactions, deletion and teacher mark entry
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/exam-setup-integrity.integration-spec.ts apps/api/test/teacher-exam-visibility.integration-spec.ts

      - name: Sidebar reads, schema upgrades and tenant isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" npm run test:sidebar-workspaces

      - name: Teacher exam visibility and marks submission
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/teacher-exam-visibility.integration-spec.ts

      - name: Staff directory pagination and school isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/staff-directory.integration-spec.ts

      - name: Exams manager teacher progress and school isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/teacher-mark-progress.integration-spec.ts

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Integration Tests (with Postgres + Redis services)
  # ──────────────────────────────────────────────────────────────
  integration-tests:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shule_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shule_hub_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: |
          npm run test:tenant-isolation
          npm run test:finance-integrity
          npm run test:auth-security

      - name: Subject teacher assignment and promotion database contracts
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" npm run test:subject-teacher-assignments

  # ──────────────────────────────────────────────────────────────
  # Docker Build + Push
  # ──────────────────────────────────────────────────────────────
  containerize:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Deploy to Railway
  # ──────────────────────────────────────────────────────────────
  deploy-railway:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'railway'
    needs:
      - build-and-test
      - integration-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            config: deploy/railway/api.railway.json
          - service: payments-worker
            config: deploy/railway/payments-worker.railway.json
          - service: events-worker
            config: deploy/railway/events-worker.railway.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Prepare Railway config
        run: node scripts/prepare-railway-config.mjs ${{ matrix.config }}

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --ci --service "${{ matrix.service }}" --project "${{ secrets.RAILWAY_PROJECT_ID }}" --environment "${{ secrets.RAILWAY_ENVIRONMENT_NAME }}"
