name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-audit:
    permissions:
      contents: read
    uses: ./.github/workflows/security-audit.yml

  # ──────────────────────────────────────────────────────────────
  # Quality Gate: Lint + Type Check
  # ──────────────────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix apps/web ci

      - name: Type check (backend)
        run: npm run typecheck

      - name: Lint (frontend)
        run: npm run web:lint

      - name: Browser authentication contracts
        run: npm --prefix apps/web run test:design -- auth.test auth-recovery-experience auth-recovery-routing password-validation pwa-entry invitation-acceptance invite-redirect persistent-login auth-route-contract auth-token-containment server-auth-client client-identity session-refreshing-fetch session-logout dashboard-api-cookie-session

      - name: Dashboard realtime transport and tenant isolation
        run: npm --prefix apps/web run test:design -- reconnecting-event-source dashboard-stream-proxy dashboard-communication-tenant proxy-body experience-routing

      - name: Legal acceptance and server access contracts
        run: npm --prefix apps/web run test:design -- legal-acceptance.test legal-server-gate legal-loading.test legal-access-proxy

      - name: Cloudflare ingress and cache isolation
        run: npm --prefix apps/web run test:cloudflare

      - name: Payment channel approval and isolated sandbox interface
        run: npm --prefix apps/web run test:design -- payment-channel-setup

      - name: Accountant daily finance, receipts and verified payment review
        run: npm --prefix apps/web run test:design -- accountant-navigation accountant-fee-structures-loading accountant-daily-workflows accountant-mpesa-review accountant-command-center-contract finance-amount-precision finance-export-safety front-office-finance-production-readiness

      - name: Conservative web build skipping
        run: node --test apps/web/scripts/ignore-build.test.mjs

      - name: Dashboard role switching and delayed session responses
        run: npm --prefix apps/web run test:design -- sidebar-session-navigation role-switch-consistency dashboard-role-context school-dashboard-role-switcher active-role-cache-isolation leadership-teacher-role-switch

      - name: Academic intelligence workspace contracts
        run: npm --prefix apps/web run test:design -- academic-intelligence exam-analytics academic-foundation academic-setup-simplification academic-policy-builders academic-curriculum-builder head-of-subject exams-workspace teacher-exams-marks-workspace dean-review-workflow dean-hod-command-center-contract

      - name: Admissions workflows, drafts and consolidated navigation
        run: npm --prefix apps/web run test:design -- admissions-dashboard-routing admissions-consolidated-workflows admissions-empty-state-workflows student-admission-wizard student-bulk-admission-feedback admissions-live-api admissions-workspace feedback-viewport operational-feedback

      - name: Authenticated mobile navigation and action contracts
        run: npm --prefix apps/web run test:design -- mobile-product mobile-workspace-navigation modal.test header-popover dropdown-menu teacher-overview-feedback exam-workflow-tracker dashboard-action-contract principal-production-readiness

      - name: Dashboard text contrast on light and dark surfaces
        run: |
          npm --prefix apps/web run test:design -- colour-consistency
          cd apps/web
          npx playwright install --with-deps chromium
          node tests/design/colour-system-browser.mjs
          node tests/design/mobile-roles-browser.mjs --all-workspaces --contrast
          npx playwright test -c playwright.legal.config.ts

      - name: Keep dashboard visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-diagnostics
          path: output/mobile-roles
          retention-days: 7

      - name: Report-card class generation and recovery interface
        run: npm --prefix apps/web run test:design -- report-card-generation-readiness live-report-card-actions official-report-preview class-teacher-name-title report-card-scopes report-regeneration-job report-card-api-contract report-card-signatures report-card-reference-layout exams-manager-entry-controls exams-manager-command-center academic-office-production-readiness

      - name: Exam setup configuration and deletion controls
        run: npm --prefix apps/web run test:design -- exam-setup-edit-delete exams-manager-human-workflows exams-manager-routing

      - name: School day builder and timetable interface
        run: npm --prefix apps/web run test:design -- school-day-builder school-day-editor subject-requirements-panel deputy-timetable-management deputy-timetable-class-scope smart-timetable-role-surfaces deputy-page-routes school-command-center-routing

  cloudflare-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: https://my-shule-api-production.up.railway.app
      SERVER_API_BASE_URL: https://my-shule-api-production.up.railway.app
      NEXT_PUBLIC_SITE_URL: https://www.myshule.online
      NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
      MYSHULE_RUNTIME: cloudflare
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Verify compiled Worker in workerd
        run: |
          cp .dev.vars.example .dev.vars
          npm run preview:cloudflare -- --port 8787 --ip 127.0.0.1 > /tmp/myshule-workerd.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/auth/csrf > /dev/null; then break; fi
            if ! kill -0 "$PREVIEW_PID" 2>/dev/null; then cat /tmp/myshule-workerd.log; exit 1; fi
            sleep 2
          done
          node cloudflare/smoke.mjs
      - name: Keep Worker diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-runtime-diagnostics
          path: /tmp/myshule-workerd.log
          retention-days: 7
      - name: Package verified build with module permissions intact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf cloudflare-build.tgz .open-next
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cloudflare-build-${{ github.sha }}
          path: apps/web/cloudflare-build.tgz
          retention-days: 7

  deploy-cloudflare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, security-audit, cloudflare-build, build-and-test, integration-tests]
    runs-on: ubuntu-latest
    environment: production-cloudflare
    permissions:
      contents: read
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-build-${{ github.sha }}
          path: apps/web
      - run: tar -xzf cloudflare-build.tgz
      - name: Prevent an older workflow from overwriting a newer main revision
        id: revision
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$latest"
          echo "current=$([ "$latest" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy verified Worker and versioned static assets
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: '79113628f46775f56ed5f91a0d91a303'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_IDENTITY_SECRET: ${{ secrets.GATEWAY_IDENTITY_SECRET }}
          SERVER_API_BASE_URL: https://my-shule-api-production.up.railway.app
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing scoped Cloudflare deployment credential'; exit 1; }
          node cloudflare/verify-origin.mjs
          node cloudflare/verify-legal-release.mjs
          secret_file=$(mktemp)
          export SECRET_FILE="$secret_file"
          trap 'rm -f "$SECRET_FILE"' EXIT
          node -e 'require("node:fs").writeFileSync(process.env.SECRET_FILE, JSON.stringify({GATEWAY_IDENTITY_SECRET:process.env.GATEWAY_IDENTITY_SECRET}), {mode:0o600})'
          npm run deploy:cloudflare -- --secrets-file "$SECRET_FILE"
      - name: Verify deployed Worker
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_SMOKE_URL: https://myshule-web.ondurobinson.workers.dev
        run: node cloudflare/smoke.mjs
      - name: Verify production domain
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_SMOKE_URL: https://www.myshule.online
        run: node cloudflare/smoke.mjs

  # ──────────────────────────────────────────────────────────────
  # Build + Unit Tests
  # ──────────────────────────────────────────────────────────────
  build-and-test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Legal policy, immutable evidence and authenticated acceptance
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: |
          node --test dist/apps/api/src/modules/legal/legal-policy.test.js dist/apps/api/src/modules/legal/legal-stream.interceptor.test.js dist/apps/api/src/interceptors/school-mutation-event.interceptor.test.js
          PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/legal-acceptance.integration-spec.ts

      - name: Signed gateway client identity
        run: node -r ts-node/register --test apps/api/src/common/gateway-identity.test.ts

      - name: SSE wire format and response compatibility
        run: node -r ts-node/register --test apps/api/test/dashboard-sse-wire.test.ts apps/api/src/interceptors/response-envelope.interceptor.test.ts apps/api/src/middleware/request-logging.middleware.test.ts

      - name: Realtime database concurrency and cursor precision
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts node -r ts-node/register/transpile-only --test apps/api/test/dashboard-sse-database.test.ts

      - name: Academic analytics print authorization and pagination
        run: node --test dist/apps/api/src/modules/exams/analytics/analytics-report.test.js dist/apps/api/src/modules/exams/analytics/analytics-library.test.js dist/apps/api/src/modules/exams/analytics/analytics-depth.test.js dist/apps/api/src/auth/head-of-subject.test.js dist/apps/api/src/modules/academics/academic-hos-assignment.test.js dist/apps/api/src/modules/academics/academic-setup-simplification.test.js

      - name: Existing-school dashboard reads and Principal operations
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" npm run test:sidebar-workspaces

      - name: Admissions contacts, pagination and tenant-safe transfers
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: |
          node --test dist/apps/api/src/modules/admissions/admissions.test.js dist/apps/api/src/modules/admissions/admissions.repository.test.js dist/apps/api/src/modules/admissions/admission-input.test.js dist/apps/api/src/modules/admin-command/admissions-command.test.js
          PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/admissions-simplification.integration-spec.ts
          PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/admission-canonical.integration-spec.ts

      - name: Report-card scopes, exports and workflow isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: |
          node --test dist/apps/api/src/modules/exams/report-card-scope.test.js dist/apps/api/src/modules/exams/services/report-card-bulk-pdf.test.js dist/apps/api/src/modules/exams/services/report-card-export.test.js dist/apps/api/src/modules/exams/services/report-card-artifact-design.test.js dist/apps/api/src/modules/exams/services/report-card-signatures.test.js dist/apps/api/src/modules/exams/services/report-card-comparison.test.js dist/apps/api/src/modules/exams/services/report-card-preview.test.js
          PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/report-card-scope.integration-spec.ts apps/api/test/report-card-comparison.integration-spec.ts

      - name: Install isolated session test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Class-teacher name titles and transactional isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: |
          node --test dist/apps/api/src/modules/class-teacher/class-teacher-name-title.test.js
          PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/class-teacher-name-title.integration-spec.ts

      - name: Verified payment ingress, accounting and tenant boundaries
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: |
          node --test dist/apps/api/src/modules/payments/ingress/collection-adapter.test.js dist/apps/api/src/modules/payments/queue/payments-worker-module.test.js dist/apps/api/src/modules/tenant-finance/payment-channel-connection.test.js
          PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/payment-ingress.integration-spec.ts apps/api/test/collection-workflow.integration-spec.ts apps/api/test/mpesa-c2b-setup.integration-spec.ts apps/api/test/payment-allocation-safety.integration-spec.ts apps/api/test/payment-portal-balances.integration-spec.ts

      - name: Accountant balances, approvals, idempotency and tenant isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: |
          node --test dist/apps/api/src/modules/billing/billing.test.js dist/apps/api/src/modules/billing/finance-workflow-controls.test.js dist/apps/api/src/modules/admin-command/admin-command.test.js
          PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/accountant-overview.integration-spec.ts apps/api/test/accountant-controls.integration-spec.ts apps/api/test/stk-legacy-schema.integration-spec.ts

      - name: Durable report jobs, private storage and worker isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: |
          node --test dist/apps/api/src/modules/exams/services/report-infrastructure.test.js dist/apps/api/src/modules/exams/services/reports-worker-module.test.js
          PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/report-infrastructure.integration-spec.ts

      - name: Persistent authentication contracts with real Redis
        run: node -r ts-node/register/transpile-only -r tsconfig-paths/register --test apps/api/src/auth/persistent-session.test.ts apps/api/src/auth/auth-recovery.service.test.ts apps/api/src/auth/password-policy.test.ts

      - name: Authentication tenant isolation and Super Admin compatibility
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/auth-security.integration-spec.ts apps/api/test/auth-experience-separation.integration-spec.ts

      - name: Academic intelligence tenant, scope and migration contracts
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/academic-intelligence.integration-spec.ts apps/api/test/academic-hos-assignment.integration-spec.ts

      - name: Exam setup transactions, deletion and teacher mark entry
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/exam-setup-integrity.integration-spec.ts apps/api/test/teacher-exam-visibility.integration-spec.ts

      - name: Report-card generation, recovery and school isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/report-card-generation.integration-spec.ts apps/api/test/report-card-readiness.integration-spec.ts

      - name: Report-card retries and concurrency
        run: node --test dist/apps/api/src/modules/exams/services/report-card-generation-resilience.test.js

      - name: School day configuration persistence and isolation
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api/test/support/run-integration-with-local-postgres.ts jest --config jest.integration.config.js --runInBand apps/api/test/timetable-period-configuration.integration-spec.ts

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Integration Tests (with Postgres + Redis services)
  # ──────────────────────────────────────────────────────────────
  integration-tests:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shule_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shule_hub_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: |
          npm run test:tenant-isolation
          npm run test:finance-integrity
          npm run test:auth-security

      - name: Subject teacher assignment and promotion database contracts
        env:
          DATABASE_URL: ""
          NODE_ENV: test
        run: PG_BIN_DIR="$(pg_config --bindir)" npm run test:subject-teacher-assignments

  # ──────────────────────────────────────────────────────────────
  # Docker Build + Push
  # ──────────────────────────────────────────────────────────────
  containerize:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Deploy to Railway
  # ──────────────────────────────────────────────────────────────
  deploy-railway:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'railway'
    needs:
      - build-and-test
      - integration-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            config: deploy/railway/api.railway.json
          - service: payments-worker
            config: deploy/railway/payments-worker.railway.json
          - service: events-worker
            config: deploy/railway/events-worker.railway.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Prepare Railway config
        run: node scripts/prepare-railway-config.mjs ${{ matrix.config }}

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway up --ci --service "${{ matrix.service }}" --project "${{ secrets.RAILWAY_PROJECT_ID }}" --environment "${{ secrets.RAILWAY_ENVIRONMENT_NAME }}"
